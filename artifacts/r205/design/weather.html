<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, initial-scale=1.0" />
<title>Lume Design — Weather v2 (480x480 Round AMOLED)</title>
<style>
  :root {
    --bg-0: #000000;
    --bg-1: #0D1420;
    --bg-2: #16202E;
    --bg-3: #1F2C3D;
    --text-hi: #F2F7FB;
    --text-mid: #9EB3C6;
    --text-low: #5C7794;
    --accent: #40D8B0;
    --warn: #FFD78E;
    --info: #5B9DF7;

    --border-subtle: rgba(242, 247, 251, 0.08);
    --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    --font-sans: "Noto Sans CJK SC", "PingFang SC", "Liberation Sans", "DejaVu Sans", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

  html, body {
    width: 480px; height: 480px;
    background: var(--bg-0);
    overflow: hidden;
    font-family: var(--font-sans);
    color: var(--text-hi);
    user-select: none;
  }

  .watch-screen {
    position: relative;
    width: 480px; height: 480px;
    border-radius: 50%;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 28%, rgba(255, 198, 92, 0.14) 0%, rgba(24, 48, 72, 0.55) 36%, #08111D 68%, #000000 92%);
    box-shadow: inset 0 0 0 1.5px rgba(158, 179, 198, 0.16);
  }

  /* Decorative outer atmospheric ring (r=214 <= 220) */
  .dial-svg {
    position: absolute;
    inset: 0;
    width: 480px; height: 480px;
    pointer-events: none;
  }

  /* Inscribed safe square: x,y in [75, 405] (330x330) */
  .safe-area {
    position: absolute;
    left: 75px; top: 75px;
    width: 330px; height: 330px;
    padding: 0 6px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Top header: city + friendly demo badge + circular refresh button */
  .header {
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .city-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .city-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .city-name {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-hi);
    line-height: 1;
  }

  .offline-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(31, 44, 61, 0.86);
    border: 1px solid rgba(158, 179, 198, 0.22);
    font-size: 12px;
    color: var(--text-mid);
    width: fit-content;
    line-height: 1.2;
  }

  .refresh-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(64, 216, 176, 0.36);
    background: linear-gradient(180deg, #173439 0%, #11232B 100%);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow-card);
  }

  /* Radial center hero: layered weather icon + bold 48px temp + condition */
  .hero {
    height: 98px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .hero-icon {
    width: 84px; height: 84px;
    flex-shrink: 0;
  }

  .hero-readout {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }

  .hero-temp {
    font-size: 48px;
    font-weight: 700;
    line-height: 0.96;
    letter-spacing: -0.03em;
    color: var(--text-hi);
    font-variant-numeric: tabular-nums;
  }

  .hero-cond {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 600;
    color: var(--text-hi);
  }

  .hero-range {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-mid);
    font-variant-numeric: tabular-nums;
  }

  /* 3 distinct metric capsules (Feels / Humidity / Wind -- zero duplication with forecast) */
  .metrics-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 318px;
  }

  .metric-pill {
    height: 54px;
    padding: 7px 6px;
    border-radius: 12px;
    background: linear-gradient(180deg, #1A2637 0%, var(--bg-2) 100%);
    border: 1px solid var(--border-subtle);
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }

  .metric-top {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text-mid);
    line-height: 1;
  }

  .metric-val {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-hi);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  /* 3-day forecast card with mini icons & temp range bars */
  .forecast-card {
    width: 318px;
    padding: 6px 12px;
    border-radius: 12px;
    background: linear-gradient(180deg, #182334 0%, #121B28 100%);
    border: 1px solid var(--border-subtle);
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
  }

  .f-row {
    height: 32px;
    display: grid;
    grid-template-columns: 42px 26px 56px 1fr 74px;
    align-items: center;
    gap: 6px;
    font-size: 14px;
  }

  .f-row + .f-row {
    border-top: 1px solid rgba(158, 179, 198, 0.1);
  }

  .f-day { color: var(--text-mid); font-weight: 600; }
  .f-icon { display: flex; align-items: center; justify-content: center; }
  .f-desc { color: var(--text-hi); font-size: 13px; }
  .f-bar-track {
    height: 5px;
    border-radius: 999px;
    background: var(--bg-3);
    position: relative;
    overflow: hidden;
  }
  .f-bar-fill {
    position: absolute;
    top: 0; bottom: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--warn));
  }
  .f-temp {
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text-hi);
    font-weight: 600;
    font-size: 14px;
  }
  .f-lo { color: var(--text-mid); font-weight: 500; }
</style>
</head>
<body>
<div class="watch-screen" role="application" aria-label="Weather">
  <svg class="dial-svg" viewBox="0 0 480 480" fill="none">
    <circle cx="240" cy="240" r="215" stroke="rgba(158,179,198,0.12)" stroke-width="1.5"/>
    <path d="M 105 72 A 215 215 0 0 1 375 72" stroke="rgba(255,215,142,0.32)" stroke-width="2.5" stroke-linecap="round"/>
  </svg>

  <main class="safe-area">
    <header class="header">
      <div class="city-group">
        <div class="city-row">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#40D8B0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s-6.5-5.6-6.5-11A6.5 6.5 0 1 1 18.5 10c0 5.4-6.5 11-6.5 11z"/>
            <circle cx="12" cy="10" r="2.2"/>
          </svg>
          <span class="city-name">北京</span>
        </div>
        <div class="offline-pill">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9EB3C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 17.6A4.5 4.5 0 0 0 18 9h-1.26A7 7 0 0 0 9.6 4.8"/>
            <path d="M6.5 7.5A5.5 5.5 0 0 0 6 18h10"/>
            <line x1="3" y1="3" x2="21" y2="21"/>
          </svg>
          <span>演示数据</span>
        </div>
      </div>

      <button class="refresh-btn" type="button" aria-label="刷新天气">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
          <polyline points="21 3 21 9 15 9"/>
        </svg>
      </button>
    </header>

    <section class="hero">
      <!-- Layered Sun + Cloud SVG (transparent background, warm radial glow) -->
      <svg class="hero-icon" viewBox="0 0 88 88" fill="none">
        <defs>
          <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFD78E" stop-opacity="0.55"/>
            <stop offset="55%" stop-color="#FFB84D" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#FFB84D" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="sunCore" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFE6A8"/>
            <stop offset="100%" stop-color="#FFA93A"/>
          </linearGradient>
          <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#F2F7FB"/>
            <stop offset="65%" stop-color="#C3D5E6"/>
            <stop offset="100%" stop-color="#8FA7BE"/>
          </linearGradient>
        </defs>
        <circle cx="54" cy="30" r="28" fill="url(#sunHalo)"/>
        <g stroke="#FFD278" stroke-width="2.4" stroke-linecap="round" opacity="0.88">
          <line x1="54" y1="7" x2="54" y2="12"/>
          <line x1="77" y1="30" x2="72" y2="30"/>
          <line x1="70" y1="14" x2="66.5" y2="17.5"/>
          <line x1="38" y1="14" x2="41.5" y2="17.5"/>
          <line x1="70" y1="46" x2="66.5" y2="42.5"/>
        </g>
        <circle cx="54" cy="30" r="14" fill="url(#sunCore)"/>
        <!-- Back shadow cloud puff -->
        <path d="M26 66h37a11 11 0 0 0 1-21.95A16 16 0 0 0 33 41a13 13 0 0 0-7 25z" fill="rgba(10,18,28,0.45)" transform="translate(0,2.5)"/>
        <!-- Foreground layered cloud -->
        <path d="M24 65h38a11 11 0 0 0 1.2-21.93A15.5 15.5 0 0 0 33.2 40.5 12.5 12.5 0 0 0 24 65z" fill="url(#cloudGrad)"/>
        <path d="M35 44a11 11 0 0 1 16-3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      </svg>

      <div class="hero-readout">
        <div class="hero-temp">18°</div>
        <div class="hero-cond">
          <span>局部多云</span>
          <span class="hero-range">9° / 21°</span>
        </div>
      </div>
    </section>

    <section class="metrics-row">
      <div class="metric-pill">
        <div class="metric-top">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFD78E" stroke-width="2.2" stroke-linecap="round">
            <path d="M14 14.76V5a2 2 0 1 0-4 0v9.76a4 4 0 1 0 4 0z"/>
          </svg>
          <span>体感</span>
        </div>
        <div class="metric-val">16°</div>
      </div>

      <div class="metric-pill">
        <div class="metric-top">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5B9DF7" stroke-width="2.2" stroke-linecap="round">
            <path d="M12 2.7l5.6 6.8a7 7 0 1 1-11.2 0L12 2.7z"/>
          </svg>
          <span>湿度</span>
        </div>
        <div class="metric-val">46%</div>
      </div>

      <div class="metric-pill">
        <div class="metric-top">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#40D8B0" stroke-width="2.2" stroke-linecap="round">
            <path d="M4 10h11a3 3 0 1 0-3-3"/>
            <path d="M4 15h14a2.5 2.5 0 1 1-2.5 2.5"/>
          </svg>
          <span>风速</span>
        </div>
        <div class="metric-val">9.4 km/h</div>
      </div>
    </section>

    <section class="forecast-card" aria-label="三日预报">
      <div class="f-row">
        <span class="f-day">今天</span>
        <span class="f-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <circle cx="15" cy="9" r="4" fill="#FFD78E"/>
            <path d="M6.5 18h10a3.5 3.5 0 0 0 .4-7A5 5 0 0 0 7.2 10.4 3.8 3.8 0 0 0 6.5 18z" fill="#DCE8F4"/>
          </svg>
        </span>
        <span class="f-desc">局部多云</span>
        <div class="f-bar-track"><div class="f-bar-fill" style="left:16%; width:66%;"></div></div>
        <span class="f-temp"><span class="f-lo">9°</span> / 21°</span>
      </div>

      <div class="f-row">
        <span class="f-day">明天</span>
        <span class="f-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M6 14h11a3.5 3.5 0 0 0 .4-7A5 5 0 0 0 7.7 6.4 3.8 3.8 0 0 0 6 14z" fill="#9EB3C6"/>
            <line x1="8" y1="16.5" x2="6.8" y2="20" stroke="#5B9DF7" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="12.5" y1="16.5" x2="11.3" y2="20" stroke="#5B9DF7" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="17" y1="16.5" x2="15.8" y2="20" stroke="#5B9DF7" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="f-desc">雨</span>
        <div class="f-bar-track"><div class="f-bar-fill" style="left:10%; width:48%;"></div></div>
        <span class="f-temp"><span class="f-lo">8°</span> / 17°</span>
      </div>

      <div class="f-row">
        <span class="f-day">后天</span>
        <span class="f-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="4.5" fill="#FFD78E"/>
            <g stroke="#FFD78E" stroke-width="1.8" stroke-linecap="round">
              <line x1="12" y1="3" x2="12" y2="5.2"/>
              <line x1="12" y1="18.8" x2="12" y2="21"/>
              <line x1="3" y1="12" x2="5.2" y2="12"/>
              <line x1="18.8" y1="12" x2="21" y2="12"/>
              <line x1="5.6" y1="5.6" x2="7.2" y2="7.2"/>
              <line x1="16.8" y1="16.8" x2="18.4" y2="18.4"/>
              <line x1="18.4" y1="5.6" x2="16.8" y2="7.2"/>
              <line x1="7.2" y1="16.8" x2="5.6" y2="18.4"/>
            </g>
          </svg>
        </span>
        <span class="f-desc">晴</span>
        <div class="f-bar-track"><div class="f-bar-fill" style="left:22%; width:68%;"></div></div>
        <span class="f-temp"><span class="f-lo">10°</span> / 22°</span>
      </div>
    </section>
  </main>
</div>
</body>
</html>
