<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, initial-scale=1.0" />
<title>Lume Design — Settings v2 (480x480 Round AMOLED)</title>
<style>
  :root {
    --bg-0: #000000;
    --bg-1: #0D1420;
    --bg-2: #16202E;
    --bg-3: #1F2C3D;
    --text-hi: #F2F7FB;
    --text-mid: #9EB3C6;
    --text-low: #5C7794;
    --accent: #40D8B0;
    --accent-deep: #117B69;
    --danger: #FF6B79;
    --warn: #FFD78E;
    --info: #5B9DF7;

    --border-subtle: rgba(242, 247, 251, 0.08);
    --border-strong: rgba(158, 179, 198, 0.22);
    --accent-soft: rgba(64, 216, 176, 0.14);
    --accent-border: rgba(64, 216, 176, 0.42);
    --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    --shadow-knob: 0 2px 5px rgba(0, 0, 0, 0.55);

    --font-sans: "Liberation Sans", "Nimbus Sans", "DejaVu Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

  html, body {
    width: 480px; height: 480px;
    background: var(--bg-0);
    overflow: hidden;
    font-family: var(--font-sans);
    color: var(--text-hi);
    user-select: none;
  }

  .watch-screen {
    position: relative;
    width: 480px; height: 480px;
    border-radius: 50%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 20%, rgba(22, 34, 50, 0.78) 0%, #09101A 54%, #000000 88%);
    box-shadow: inset 0 0 0 1.5px rgba(158, 179, 198, 0.18);
  }

  .bezel-ring {
    position: absolute;
    inset: 14px;
    border-radius: 50%;
    border: 1px solid rgba(158, 179, 198, 0.12);
    pointer-events: none;
  }

  /* Inscribed safe square: x,y in [75, 405] (330x330) */
  .safe-area {
    position: absolute;
    left: 75px; top: 75px;
    width: 330px; height: 330px;
    padding: 0 5px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Compact top header with time + battery complications flanking title */
  .header {
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2px;
  }

  .comp-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 24px;
    padding: 0 8px;
    border-radius: 999px;
    background: rgba(22, 32, 46, 0.9);
    border: 1px solid var(--border-subtle);
    font-size: 14px;
    font-weight: 600;
    color: var(--text-mid);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .comp-pill.batt { color: var(--accent); border-color: rgba(64, 216, 176, 0.24); }

  .page-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-hi);
    line-height: 1;
  }

  .groups {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .group-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--text-low);
    padding-left: 4px;
    line-height: 1;
  }

  .group-stack {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .setting-row {
    width: 320px;
    height: 52px;
    padding: 0 12px;
    border-radius: 12px;
    background: linear-gradient(180deg, #1B2738 0%, var(--bg-2) 100%);
    border: 1px solid var(--border-subtle);
    box-shadow: var(--shadow-card);
    display: flex;
    align-items: center;
    gap: 11px;
    cursor: pointer;
    transition: border-color 140ms ease, background 140ms ease;
  }

  .setting-row.is-on {
    background: linear-gradient(180deg, #152D33 0%, #11222A 100%);
    border-color: var(--accent-border);
  }

  .icon-disc {
    width: 34px; height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .icon-disc.teal { background: linear-gradient(180deg, #163B3A 0%, #0E2528 100%); color: var(--accent); }
  .icon-disc.blue { background: linear-gradient(180deg, #18304B 0%, #102034 100%); color: var(--info); }
  .icon-disc.amber { background: linear-gradient(180deg, #3A2E1A 0%, #241C10 100%); color: var(--warn); }
  .icon-disc.slate { background: linear-gradient(180deg, #253447 0%, #182332 100%); color: var(--text-hi); }

  .row-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-hi);
    flex: 1;
    line-height: 1;
  }

  .row-value {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-mid);
    font-variant-numeric: tabular-nums;
    margin-right: 2px;
  }

  /* Compact inline volume bar */
  .vol-mini {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .vol-rail {
    width: 58px; height: 6px;
    border-radius: 999px;
    background: var(--bg-3);
    overflow: hidden;
    border: 1px solid rgba(158, 179, 198, 0.16);
  }
  .vol-fill {
    width: 50%; height: 100%;
    background: linear-gradient(90deg, var(--accent-deep), var(--accent));
    border-radius: 999px;
  }

  /* iOS-style switch */
  .switch-track {
    position: relative;
    width: 44px; height: 24px;
    border-radius: 999px;
    background: var(--bg-3);
    border: 1px solid rgba(158, 179, 198, 0.24);
    flex-shrink: 0;
    transition: background 180ms ease;
  }
  .setting-row.is-on .switch-track {
    background: var(--accent);
    border-color: rgba(255, 255, 255, 0.28);
  }
  .switch-knob {
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: linear-gradient(180deg, #FFFFFF 0%, #DCE7F2 100%);
    box-shadow: var(--shadow-knob);
    transition: transform 180ms ease;
  }
  .setting-row.is-on .switch-knob {
    transform: translateX(20px);
  }

  .chevron {
    width: 14px; height: 14px;
    color: var(--text-low);
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="watch-screen" role="application" aria-label="Settings">
  <div class="bezel-ring"></div>

  <main class="safe-area">
    <header class="header">
      <div class="comp-pill" aria-label="Time">10:09</div>
      <h1 class="page-title">Settings</h1>
      <div class="comp-pill batt" aria-label="Battery">
        <svg width="15" height="10" viewBox="0 0 18 11" fill="none">
          <rect x="0.75" y="1" width="14" height="9" rx="2" stroke="#40D8B0" stroke-width="1.5"/>
          <rect x="2.75" y="3" width="8.5" height="5" rx="1" fill="#40D8B0"/>
          <rect x="15.75" y="3.5" width="1.8" height="4" rx="0.8" fill="#40D8B0"/>
        </svg>
        <span>85%</span>
      </div>
    </header>

    <section class="groups">
      <!-- Group 1: CONNECTIONS -->
      <div class="group">
        <div class="group-label">CONNECTIONS</div>
        <div class="group-stack">
          <div class="setting-row is-on" id="row-wifi" role="button" tabindex="0">
            <div class="icon-disc teal">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <path d="M2.5 8.8a13.5 13.5 0 0 1 19 0"/>
                <path d="M6.2 12.6a8.2 8.2 0 0 1 11.6 0"/>
                <path d="M9.8 16.2a3.2 3.2 0 0 1 4.4 0"/>
                <circle cx="12" cy="19.5" r="1.4" fill="currentColor" stroke="none"/>
              </svg>
            </div>
            <span class="row-title">Wi-Fi</span>
            <div class="switch-track"><div class="switch-knob"></div></div>
            <svg class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 3.5 10.5 8 6 12.5"/>
            </svg>
          </div>

          <div class="setting-row" id="row-bt" role="button" tabindex="0">
            <div class="icon-disc blue">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="7 7 17 17 12 22 12 2 17 7 7 17"/>
              </svg>
            </div>
            <span class="row-title">Bluetooth</span>
            <div class="switch-track"><div class="switch-knob"></div></div>
            <svg class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 3.5 10.5 8 6 12.5"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Group 2: SOUND -->
      <div class="group">
        <div class="group-label">SOUND</div>
        <div class="group-stack">
          <div class="setting-row" id="row-sound" role="button" tabindex="0">
            <div class="icon-disc amber">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="4 9 9 9 14 4.5 14 19.5 9 15 4 15" fill="currentColor" fill-opacity="0.2"/>
                <path d="M17.5 8.5a5 5 0 0 1 0 7"/>
                <path d="M20.2 5.8a8.8 8.8 0 0 1 0 12.4"/>
              </svg>
            </div>
            <span class="row-title">Volume</span>
            <div class="vol-mini">
              <div class="vol-rail"><div class="vol-fill"></div></div>
              <span class="row-value">50%</span>
            </div>
            <svg class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 3.5 10.5 8 6 12.5"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Group 3: DEVICE -->
      <div class="group">
        <div class="group-label">DEVICE</div>
        <div class="group-stack">
          <div class="setting-row" id="row-device" role="button" tabindex="0">
            <div class="icon-disc slate">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3.2"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </div>
            <span class="row-title">General</span>
            <span class="row-value">System</span>
            <svg class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 3.5 10.5 8 6 12.5"/>
            </svg>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
  document.getElementById('row-wifi').addEventListener('click', function () {
    this.classList.toggle('is-on');
  });
  document.getElementById('row-bt').addEventListener('click', function () {
    this.classList.toggle('is-on');
  });
</script>
</body>
</html>
