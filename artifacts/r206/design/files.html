<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, initial-scale=1.0" />
<title>Lume Design — Files Browser (480x480 Round AMOLED)</title>
<style>
  :root {
    --bg-0: #000000;
    --bg-1: #0D1420;
    --bg-2: #16202E;
    --bg-3: #1F2C3D;
    --text-hi: #F2F7FB;
    --text-mid: #9EB3C6;
    --text-low: #5C7794;
    --accent: #40D8B0;
    --warn: #FFD78E;
    --danger: #FF6B79;
    --info: #5B9DF7;
    --border-subtle: rgba(242, 247, 251, 0.08);
    --font-sans: "Liberation Sans", "Nimbus Sans", "DejaVu Sans", -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  html, body {
    width: 480px; height: 480px; background: var(--bg-0); overflow: hidden;
    font-family: var(--font-sans); color: var(--text-hi); user-select: none;
  }
  .watch-screen {
    position: relative; width: 480px; height: 480px;
    border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 50% 18%, rgba(22, 34, 50, 0.8) 0%, #09101A 54%, #000000 88%);
    box-shadow: inset 0 0 0 1.5px rgba(158, 179, 198, 0.18);
  }
  .bezel-ring {
    position: absolute; inset: 14px; border-radius: 50%;
    border: 1px solid rgba(158, 179, 198, 0.12); pointer-events: none;
  }
  .safe-area {
    position: absolute; left: 75px; top: 75px;
    width: 330px; height: 330px; padding: 0 5px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  /* Breadcrumb bar */
  .topbar {
    width: 320px; height: 48px;
    display: flex; align-items: center; gap: 8px;
  }
  .nav-back {
    width: 48px; height: 48px; border-radius: 12px;
    background: var(--bg-2); border: 1px solid var(--border-subtle);
    display: flex; align-items: center; justify-content: center; color: var(--text-hi);
    flex-shrink: 0;
  }
  .crumb-pill {
    flex: 1; height: 48px; padding: 0 12px; border-radius: 12px;
    background: var(--bg-2); border: 1px solid var(--border-subtle);
    display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0;
  }
  .crumb-path {
    font-size: 14px; font-weight: 700; color: var(--text-hi);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .crumb-meta {
    font-size: 11px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums;
  }
  /* File list */
  .file-list {
    width: 320px; height: 212px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .file-row {
    width: 320px; height: 48px; padding: 0 6px 0 10px;
    border-radius: 12px;
    background: linear-gradient(180deg, #1B2738 0%, var(--bg-2) 100%);
    border: 1px solid var(--border-subtle);
    display: flex; align-items: center; gap: 10px;
  }
  .file-row.selected {
    background: linear-gradient(180deg, #152D33 0%, #102129 100%);
    border-color: rgba(64, 216, 176, 0.45);
  }
  .f-icon {
    width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .f-icon.dir { background: rgba(255, 215, 142, 0.14); color: var(--warn); }
  .f-icon.sd { background: rgba(91, 157, 247, 0.16); color: var(--info); }
  .f-icon.doc { background: rgba(64, 216, 176, 0.14); color: var(--accent); }
  .f-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .f-name { font-size: 14px; font-weight: 600; color: var(--text-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f-sub { font-size: 11px; color: var(--text-mid); font-variant-numeric: tabular-nums; }
  .row-del {
    width: 36px; height: 36px; border-radius: 8px;
    background: rgba(255, 107, 121, 0.12); border: 1px solid rgba(255, 107, 121, 0.28);
    color: var(--danger); display: flex; align-items: center; justify-content: center;
  }
  /* Empty state (toggleable) */
  .empty-state {
    display: none;
    width: 320px; height: 212px; border-radius: 12px;
    background: rgba(22, 32, 46, 0.6); border: 1px dashed rgba(158, 179, 198, 0.22);
    flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    color: var(--text-mid); font-size: 14px;
  }
  .watch-screen[data-empty="1"] .file-list { display: none; }
  .watch-screen[data-empty="1"] .empty-state { display: flex; }
  /* Action Bar */
  .actions { width: 320px; height: 48px; display: flex; gap: 8px; }
  .act-btn {
    flex: 1; height: 48px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    font-size: 13px; font-weight: 700;
    background: var(--bg-2); border: 1px solid var(--border-subtle); color: var(--text-hi);
  }
  .act-btn.primary { background: var(--accent); color: #07131A; border-color: #6EEAC8; }
  .act-btn.danger {
    background: rgba(255, 107, 121, 0.15);
    border-color: rgba(255, 107, 121, 0.42);
    color: var(--danger);
  }
</style>
</head>
<body>
<div class="watch-screen" id="screen" data-empty="0" role="application" aria-label="Files">
  <div class="bezel-ring"></div>
  <main class="safe-area">
    <header class="topbar">
      <div class="nav-back" role="button" aria-label="Up">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="11 4 6 9 11 14"/>
        </svg>
      </div>
      <div class="crumb-pill">
        <div class="crumb-path">/ · storage</div>
        <div class="crumb-meta">4 items · SD 1024MB FREE</div>
      </div>
    </header>

    <section class="file-list">
      <div class="file-row" role="button">
        <div class="f-icon sd">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M5 3h7l3 3v11H5V3z"/><line x1="8" y1="6" x2="8" y2="9"/><line x1="11" y1="6" x2="11" y2="9"/>
          </svg>
        </div>
        <div class="f-meta">
          <div class="f-name">SD/</div>
          <div class="f-sub">TF Card · Mount</div>
        </div>
      </div>

      <div class="file-row" role="button">
        <div class="f-icon dir">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M2.5 5.5h5l2 2h8v8.5h-15V5.5z"/>
          </svg>
        </div>
        <div class="f-meta">
          <div class="f-name">logs</div>
          <div class="f-sub">Folder · 2026-11</div>
        </div>
        <div class="row-del" role="button" aria-label="Delete">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M3 4.5h10M6 4.5V3h4v1.5M5 4.5l.6 8.5h4.8l.6-8.5"/>
          </svg>
        </div>
      </div>

      <div class="file-row selected" role="button">
        <div class="f-icon doc">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M5 3h6.5L15 6.5V17H5V3z"/><line x1="7.5" y1="10" x2="12.5" y2="10"/><line x1="7.5" y1="13" x2="11" y2="13"/>
          </svg>
        </div>
        <div class="f-meta">
          <div class="f-name">boot.txt</div>
          <div class="f-sub">Text · 1.2 KB</div>
        </div>
        <div class="row-del" role="button" aria-label="Delete">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M3 4.5h10M6 4.5V3h4v1.5M5 4.5l.6 8.5h4.8l.6-8.5"/>
          </svg>
        </div>
      </div>

      <div class="file-row" role="button">
        <div class="f-icon doc">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M5 3h6.5L15 6.5V17H5V3z"/><line x1="7.5" y1="10" x2="12.5" y2="10"/><line x1="7.5" y1="13" x2="11" y2="13"/>
          </svg>
        </div>
        <div class="f-meta">
          <div class="f-name">config.json</div>
          <div class="f-sub">JSON · 420 B</div>
        </div>
        <div class="row-del" role="button" aria-label="Delete">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M3 4.5h10M6 4.5V3h4v1.5M5 4.5l.6 8.5h4.8l.6-8.5"/>
          </svg>
        </div>
      </div>
    </section>

    <section class="empty-state">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none" stroke="#5C7794" stroke-width="2" stroke-linejoin="round">
        <path d="M5 10h9l3 3h14v15H5V10z"/>
      </svg>
      <span>No files in this folder</span>
    </section>

    <footer class="actions">
      <div class="act-btn" role="button">New Dir</div>
      <div class="act-btn primary" role="button">View</div>
      <div class="act-btn danger" role="button">Delete</div>
    </footer>
  </main>
</div>
</body>
</html>
