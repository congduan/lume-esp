<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, initial-scale=1.0" />
<title>Lume Design — Settings: Bluetooth (480x480 Round AMOLED)</title>
<style>
  :root {
    --bg-0: #000000;
    --bg-1: #0D1420;
    --bg-2: #16202E;
    --bg-3: #1F2C3D;
    --text-hi: #F2F7FB;
    --text-mid: #9EB3C6;
    --text-low: #5C7794;
    --accent: #40D8B0;
    --info: #5B9DF7;
    --danger: #FF6B79;
    --border-subtle: rgba(242, 247, 251, 0.08);
    --font-sans: "Liberation Sans", "Nimbus Sans", "DejaVu Sans", -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  html, body {
    width: 480px; height: 480px; background: var(--bg-0); overflow: hidden;
    font-family: var(--font-sans); color: var(--text-hi); user-select: none;
  }
  .watch-screen {
    position: relative; width: 480px; height: 480px;
    border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 50% 18%, rgba(22, 34, 50, 0.8) 0%, #09101A 54%, #000000 88%);
    box-shadow: inset 0 0 0 1.5px rgba(158, 179, 198, 0.18);
  }
  .bezel-ring {
    position: absolute; inset: 14px; border-radius: 50%;
    border: 1px solid rgba(158, 179, 198, 0.12); pointer-events: none;
  }
  .safe-area {
    position: absolute; left: 75px; top: 75px;
    width: 330px; height: 330px; padding: 0 5px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .header {
    height: 36px; display: flex; align-items: center; justify-content: space-between;
  }
  .back-btn {
    width: 48px; height: 32px; border-radius: 999px;
    background: var(--bg-2); border: 1px solid var(--border-subtle);
    display: flex; align-items: center; justify-content: center; color: var(--text-mid);
  }
  .page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .state-pill {
    height: 24px; padding: 0 9px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    background: rgba(91, 157, 247, 0.16);
    border: 1px solid rgba(91, 157, 247, 0.45);
    color: var(--info);
  }
  .state-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  /* Hero Card */
  .bt-hero {
    width: 320px; padding: 14px;
    border-radius: 12px;
    background: linear-gradient(180deg, #162840 0%, #111D2D 100%);
    border: 1px solid rgba(91, 157, 247, 0.38);
    display: flex; flex-direction: column; gap: 12px;
  }
  .hero-top { display: flex; align-items: center; gap: 12px; }
  .icon-disc {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    background: #152B44; border: 1px solid #2F5C8D; color: var(--info);
    display: flex; align-items: center; justify-content: center;
  }
  .dev-meta { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .dev-name { font-size: 18px; font-weight: 700; color: var(--text-hi); }
  .dev-role { font-size: 12px; color: var(--text-mid); }
  .switch-track {
    position: relative; width: 48px; height: 26px; border-radius: 999px;
    background: var(--accent); border: 1px solid #72ECCA; flex-shrink: 0;
  }
  .switch-knob {
    position: absolute; top: 2px; right: 2px; width: 20px; height: 20px;
    border-radius: 50%; background: #FFFFFF;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
  }
  .state-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 10px; border-top: 1px solid rgba(158, 179, 198, 0.14);
    font-size: 12px; color: var(--text-mid);
  }
  .state-bar strong { color: var(--info); font-weight: 700; letter-spacing: 0.04em; }
  /* Rename card */
  .group-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
    color: var(--text-low); padding-left: 4px;
  }
  .row-card {
    width: 320px; height: 52px; padding: 0 12px;
    border-radius: 12px;
    background: linear-gradient(180deg, #1B2738 0%, var(--bg-2) 100%);
    border: 1px solid var(--border-subtle);
    display: flex; align-items: center; gap: 10px;
  }
  .row-title { flex: 1; font-size: 15px; font-weight: 600; }
  .row-val { font-size: 14px; color: var(--text-mid); font-weight: 600; }
  /* Action buttons */
  .actions { width: 320px; height: 48px; display: flex; gap: 8px; }
  .act-btn {
    flex: 1; height: 48px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
  }
  .act-btn.disabled {
    background: var(--bg-3); border: 1px solid var(--border-subtle);
    color: var(--text-low);
  }
  .act-btn.stop {
    background: rgba(255, 107, 121, 0.14);
    border: 1px solid rgba(255, 107, 121, 0.42);
    color: var(--danger);
  }
  .hint {
    text-align: center; font-size: 12px; color: var(--text-low);
  }
</style>
</head>
<body>
<div class="watch-screen" role="application" aria-label="Bluetooth Settings">
  <div class="bezel-ring"></div>
  <main class="safe-area">
    <header class="header">
      <div class="back-btn" role="button" aria-label="Back">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="10 3.5 5.5 8 10 12.5"/>
        </svg>
      </div>
      <h1 class="page-title">Bluetooth</h1>
      <div class="state-pill"><span class="dot"></span><span>ADV</span></div>
    </header>

    <section class="bt-hero">
      <div class="hero-top">
        <div class="icon-disc">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="7 7 17 17 12 22 12 2 17 7 7 17"/>
          </svg>
        </div>
        <div class="dev-meta">
          <div class="dev-name">Lume</div>
          <div class="dev-role">BLE GATT Peripheral</div>
        </div>
        <div class="switch-track"><div class="switch-knob"></div></div>
      </div>
      <div class="state-bar">
        <span>Status</span>
        <strong>ADVERTISING · MTU 247</strong>
      </div>
    </section>

    <div class="group-label">IDENTITY</div>
    <section class="row-card" role="button">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#9EB3C6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13.5 3.5l3 3L7 16H4v-3l9.5-9.5z"/>
      </svg>
      <span class="row-title">Device Name</span>
      <span class="row-val">Lume</span>
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#5C7794" stroke-width="2" stroke-linecap="round">
        <polyline points="6 3.5 10.5 8 6 12.5"/>
      </svg>
    </section>

    <section class="actions">
      <div class="act-btn disabled" aria-disabled="true">Advertising</div>
      <div class="act-btn stop" role="button">Stop</div>
    </section>

    <div class="hint">Discoverable as Nordic-UART peripheral</div>
  </main>
</div>
</body>
</html>
