<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, initial-scale=1.0" />
<title>Lume Design — Fitness Activity (480x480 Round AMOLED)</title>
<style>
  :root {
    /* Primitive Tokens — docs/DESIGN-TOKENS.md §1 */
    --bg-0: #000000;
    --bg-1: #0D1420;
    --bg-2: #16202E;
    --bg-3: #1F2C3D;
    --text-hi: #F2F7FB;
    --text-mid: #9EB3C6;
    --text-low: #5C7794;
    --accent: #40D8B0;
    --accent-deep: #117B69;
    --danger: #FF6B79;
    --warn: #FFD78E;
    --info: #5B9DF7;

    /* Typography — 3 levels: fs-display (48px), fs-body (18px), fs-hud (14px) */
    --fs-hud: 14px;
    --fs-body: 18px;
    --fs-display: 48px;

    /* Spacing & Radii (card <= 12px redline) */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --radius-card: 12px;
    --radius-pill: 999px;

    /* Extended Ring Track & Surface Tokens */
    --border-subtle: rgba(242, 247, 251, 0.09);
    --border-strong: rgba(158, 179, 198, 0.22);
    --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);

    --font-sans: "Liberation Sans", "Nimbus Sans", "DejaVu Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  html, body {
    width: 480px;
    height: 480px;
    background: var(--bg-0);
    overflow: hidden;
    font-family: var(--font-sans);
    color: var(--text-hi);
    user-select: none;
  }

  .watch-screen {
    position: relative;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 45%, #0F1826 0%, #070C14 54%, #000000 84%);
    box-shadow: inset 0 0 0 1.5px rgba(158, 179, 198, 0.14);
  }

  /* Triple Concentric Activity Rings (decorative, outer edge r = 215px <= 220px) */
  .rings-svg {
    position: absolute;
    inset: 0;
    width: 480px;
    height: 480px;
    pointer-events: none;
  }

  /* Central radial content well inside inner ring (r = 160px) and [75, 405] */
  .center-dial {
    position: absolute;
    left: 100px;
    top: 100px;
    width: 280px;
    height: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 10px 8px 10px;
  }

  .top-meta {
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: var(--fs-hud);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-mid);
    line-height: 1;
  }

  /* Hero single primary metric */
  .hero-metric {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 4px 12px;
    border-radius: var(--radius-card);
    border: none;
    background: transparent;
    font-family: var(--font-sans);
    font-size: var(--fs-hud);
    transition: transform 110ms ease;
  }

  .hero-metric:active {
    transform: scale(0.96);
  }

  .hero-metric:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .hero-kicker {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: var(--fs-hud);
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    line-height: 1;
  }

  .hero-value {
    font-size: var(--fs-display);
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.02;
    font-variant-numeric: tabular-nums;
    color: var(--text-hi);
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.6);
  }

  .hero-goal {
    font-size: var(--fs-hud);
    font-weight: 500;
    color: var(--text-mid);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  /* Two tactile companion metric cards inside inner ring chord (width 244px) */
  .metric-pair {
    width: 244px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .metric-card {
    height: 68px;
    padding: 8px 10px;
    border-radius: var(--radius-card);
    background: linear-gradient(180deg, #1B2738 0%, var(--bg-2) 100%);
    border: 1px solid var(--border-subtle);
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    font-family: var(--font-sans);
    font-size: var(--fs-hud);
    transition: transform 110ms ease, border-color 150ms ease, background 150ms ease;
  }

  .metric-card:hover {
    border-color: var(--border-strong);
  }

  .metric-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .metric-card:active {
    transform: scale(0.95);
  }

  .metric-card:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .metric-card.is-selected {
    border-color: rgba(242, 247, 251, 0.28);
    background: linear-gradient(180deg, #223247 0%, #192536 100%);
  }

  .metric-head {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: var(--fs-hud);
    font-weight: 600;
    color: var(--text-mid);
    line-height: 1;
  }

  .metric-val {
    font-size: var(--fs-body);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-hi);
    line-height: 1.1;
  }

  .metric-unit {
    font-size: var(--fs-hud);
    font-weight: 500;
    color: var(--text-mid);
    margin-left: 3px;
  }

  /* Bottom compact live zone strip inside inner ring */
  .zone-strip {
    height: 20px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: var(--fs-hud);
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--text-mid);
    line-height: 1;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--danger);
    box-shadow: 0 0 8px var(--danger);
  }
</style>
</head>
<body>
  <main class="watch-screen" aria-label="Fitness Activity">
    <!-- Triple Concentric Activity Rings: Steps (#40D8B0), Calories (#FFD78E), Heart Rate (#FF6B79) -->
    <svg class="rings-svg" viewBox="0 0 480 480" aria-hidden="true">
      <defs>
        <filter id="glowSteps" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3.5" result="b" />
          <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <filter id="glowWarn" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3" result="b" />
          <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <filter id="glowDanger" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3" result="b" />
          <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
      </defs>

      <!-- Outer Ring: STEPS (r = 207, stroke 14 -> outer edge 214px <= 220px) -->
      <circle cx="240" cy="240" r="207" fill="none" stroke="rgba(64, 216, 176, 0.14)" stroke-width="14" />
      <circle
        cx="240" cy="240" r="207"
        fill="none"
        stroke="#40D8B0"
        stroke-width="14"
        stroke-linecap="round"
        stroke-dasharray="1300.62"
        stroke-dashoffset="234.11"
        transform="rotate(-90 240 240)"
        filter="url(#glowSteps)"
      />

      <!-- Middle Ring: CALORIES (r = 187, stroke 14) -->
      <circle cx="240" cy="240" r="187" fill="none" stroke="rgba(255, 215, 142, 0.14)" stroke-width="14" />
      <circle
        cx="240" cy="240" r="187"
        fill="none"
        stroke="#FFD78E"
        stroke-width="14"
        stroke-linecap="round"
        stroke-dasharray="1174.96"
        stroke-dashoffset="375.99"
        transform="rotate(-90 240 240)"
        filter="url(#glowWarn)"
      />

      <!-- Inner Ring: HEART RATE (r = 167, stroke 14 -> inner edge 160px) -->
      <circle cx="240" cy="240" r="167" fill="none" stroke="rgba(255, 107, 121, 0.14)" stroke-width="14" />
      <circle
        cx="240" cy="240" r="167"
        fill="none"
        stroke="#FF6B79"
        stroke-width="14"
        stroke-linecap="round"
        stroke-dasharray="1049.29"
        stroke-dashoffset="272.82"
        transform="rotate(-90 240 240)"
        filter="url(#glowDanger)"
      />

      <!-- Crisp 12-o'clock directional start chevrons on each ring (watchOS signature detail) -->
      <path d="M238.5 30L242.5 33L238.5 36" fill="none" stroke="#0D1420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M238.5 50L242.5 53L238.5 56" fill="none" stroke="#0D1420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M238.5 70L242.5 73L238.5 76" fill="none" stroke="#0D1420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>

    <!-- All text & interactive controls strictly inside inner ring & [75, 405] -->
    <section class="center-dial">
      <header class="top-meta">
        <span>TODAY</span>
        <span aria-hidden="true">·</span>
        <span>FRI 27</span>
      </header>

      <button id="heroBtn" class="hero-metric" type="button" aria-label="Primary metric">
        <span id="heroKicker" class="hero-kicker">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M5.4 2.2C4.1 2.2 3.2 3.5 3.4 5.2C3.6 6.6 4.5 7.5 5.6 7.5C6.7 7.5 7.2 6.5 7.1 5.0C7.0 3.4 6.4 2.2 5.4 2.2ZM5.3 8.8C4.3 8.8 3.7 9.6 3.9 10.6C4.0 11.4 4.7 12.0 5.4 12.0C6.2 12.0 6.8 11.3 6.7 10.3C6.6 9.4 6.1 8.8 5.3 8.8ZM10.6 4.4C9.6 4.4 9.0 5.6 8.9 7.2C8.8 8.7 9.3 9.7 10.4 9.7C11.5 9.7 12.4 8.8 12.6 7.4C12.8 5.7 11.9 4.4 10.6 4.4ZM10.7 11.0C9.9 11.0 9.4 11.6 9.3 12.5C9.2 13.5 9.8 14.2 10.6 14.2C11.3 14.2 12.0 13.6 12.1 12.8C12.3 11.8 11.7 11.0 10.7 11.0Z" />
          </svg>
          <span id="heroLabel">STEPS</span>
        </span>
        <span id="heroValue" class="hero-value">8,240</span>
        <span id="heroGoal" class="hero-goal">82% of 10,000</span>
      </button>

      <div class="metric-pair" role="group" aria-label="Companion metrics">
        <button id="cardHr" class="metric-card" type="button">
          <span class="metric-head">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="#FF6B79" aria-hidden="true">
              <path d="M8 14.1C8 14.1 2 10.4 2 6.1C2 4.1 3.5 2.6 5.4 2.6C6.6 2.6 7.5 3.3 8 4.2C8.5 3.3 9.4 2.6 10.6 2.6C12.5 2.6 14 4.1 14 6.1C14 10.4 8 14.1 8 14.1Z" />
            </svg>
            HEART
          </span>
          <span class="metric-val">118<span class="metric-unit">bpm</span></span>
        </button>

        <button id="cardCal" class="metric-card" type="button">
          <span class="metric-head">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="#FFD78E" aria-hidden="true">
              <path d="M8.6 1.8C8.8 4.3 6.2 5.4 5.5 7.4C5.1 8.5 5.4 9.8 6.2 10.6C5.8 9.6 6.2 8.5 7.1 7.9C7.0 9.4 8.2 10.2 8.2 11.6C8.2 12.5 7.6 13.3 6.8 13.7C7.3 13.9 7.8 14 8.4 14C11.1 14 13 11.9 13 9.2C13 6.2 10.6 3.7 8.6 1.8Z" />
            </svg>
            BURN
          </span>
          <span class="metric-val">410<span class="metric-unit">kcal</span></span>
        </button>
      </div>

      <div class="zone-strip">
        <span class="live-dot" aria-hidden="true"></span>
        <span>ZONE 2 · FAT BURN</span>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const views = {
        steps: { label: 'STEPS', value: '8,240', goal: '82% of 10,000', color: '#40D8B0' },
        hr:    { label: 'HEART RATE', value: '118', goal: 'Zone 2 · Peak 142', color: '#FF6B79' },
        cal:   { label: 'CALORIES', value: '410', goal: '68% of 600 kcal', color: '#FFD78E' }
      };
      let current = 'steps';
      const kicker = document.getElementById('heroKicker');
      const label = document.getElementById('heroLabel');
      const value = document.getElementById('heroValue');
      const goal = document.getElementById('heroGoal');
      const cardHr = document.getElementById('cardHr');
      const cardCal = document.getElementById('cardCal');

      function setView(k) {
        current = k;
        const v = views[k];
        kicker.style.color = v.color;
        label.textContent = v.label;
        value.textContent = v.value;
        goal.textContent = v.goal;
        cardHr.classList.toggle('is-selected', k === 'hr');
        cardCal.classList.toggle('is-selected', k === 'cal');
      }

      document.getElementById('heroBtn').onclick = () => setView('steps');
      cardHr.onclick = () => setView(current === 'hr' ? 'steps' : 'hr');
      cardCal.onclick = () => setView(current === 'cal' ? 'steps' : 'cal');
    })();
  </script>
</body>
</html>
