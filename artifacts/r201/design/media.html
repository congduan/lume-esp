<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, initial-scale=1.0" />
<title>Lume Design — Media Player (480x480 Round AMOLED)</title>
<style>
  :root {
    /* Primitive Tokens — docs/DESIGN-TOKENS.md §1 */
    --bg-0: #000000;
    --bg-1: #0D1420;
    --bg-2: #16202E;
    --bg-3: #1F2C3D;
    --text-hi: #F2F7FB;
    --text-mid: #9EB3C6;
    --text-low: #5C7794;
    --accent: #40D8B0;
    --accent-deep: #117B69;
    --danger: #FF6B79;
    --warn: #FFD78E;
    --info: #5B9DF7;

    /* Typography — 2 levels: fs-title (24px) & fs-hud (14px) */
    --fs-hud: 14px;
    --fs-title: 24px;

    /* Spacing & Radii */
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --radius-pill: 999px;

    /* Extended Surface & Elevation Tokens */
    --border-subtle: rgba(242, 247, 251, 0.1);
    --border-strong: rgba(158, 179, 198, 0.22);
    --shadow-disc: 0 10px 26px rgba(0, 0, 0, 0.68);
    --shadow-play: 0 8px 24px rgba(64, 216, 176, 0.34);
    --shadow-btn: 0 4px 12px rgba(0, 0, 0, 0.48);

    --font-sans: "Liberation Sans", "Nimbus Sans", "DejaVu Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  html, body {
    width: 480px;
    height: 480px;
    background: var(--bg-0);
    overflow: hidden;
    font-family: var(--font-sans);
    color: var(--text-hi);
    user-select: none;
  }

  .watch-screen {
    position: relative;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 34%, rgba(17, 123, 105, 0.24) 0%, rgba(13, 20, 32, 0.78) 46%, #000000 80%);
    box-shadow: inset 0 0 0 1.5px rgba(158, 179, 198, 0.14);
  }

  /* Subtle outer ambient dial ring (decorative, r = 212px <= 220px) */
  .ambient-bezel {
    position: absolute;
    inset: 24px;
    border-radius: 50%;
    border: 1px solid rgba(158, 179, 198, 0.08);
    pointer-events: none;
  }

  /* Inscribed safe square: x,y in [75, 405] (330x330) */
  .safe-area {
    position: absolute;
    left: 75px;
    top: 75px;
    width: 330px;
    height: 330px;
    padding: 4px 10px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }

  /* Album Cover Disc + Concentric SVG Playback Progress Ring */
  .cover-stage {
    position: relative;
    width: 132px;
    height: 132px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cover-ring-svg {
    position: absolute;
    inset: 0;
    width: 132px;
    height: 132px;
  }

  .cover-disc {
    position: relative;
    width: 108px;
    height: 108px;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: var(--shadow-disc), inset 0 1px 1px rgba(255, 255, 255, 0.22);
    border: 1.5px solid rgba(242, 247, 251, 0.14);
  }

  .cover-disc svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Track title + artist / elapsed time */
  .track-meta {
    width: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
  }

  .track-title {
    max-width: 296px;
    font-size: var(--fs-title);
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text-hi);
    line-height: 1.05;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-sub {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: var(--fs-hud);
    font-weight: 500;
    color: var(--text-mid);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .sub-sep {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--text-low);
  }

  /* Wear OS 3-key Transport Controls: Prev / Play-Pause / Next */
  .transport {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-5);
    height: 64px;
  }

  .ctrl-btn {
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 1px solid var(--border-strong);
    transition: transform 110ms ease, background 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
  }

  .ctrl-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .ctrl-btn:active:not(:disabled) {
    transform: scale(0.92);
  }

  .ctrl-btn:disabled {
    opacity: 0.32;
    cursor: not-allowed;
  }

  .ctrl-skip {
    width: 52px;
    height: 52px;
    background: linear-gradient(180deg, #243347 0%, #182333 100%);
    color: var(--text-hi);
    box-shadow: var(--shadow-btn), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }

  .ctrl-skip:hover:not(:disabled) {
    border-color: var(--text-mid);
    background: linear-gradient(180deg, #2B3D54 0%, #1E2C40 100%);
  }

  .ctrl-play {
    width: 64px;
    height: 64px;
    border: none;
    background: linear-gradient(180deg, #56E6C0 0%, #40D8B0 55%, #2AC19A 100%);
    color: var(--bg-1);
    box-shadow: var(--shadow-play), inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }

  .ctrl-play:hover:not(:disabled) {
    background: linear-gradient(180deg, #68EECA 0%, #48E0B9 100%);
    box-shadow: 0 10px 28px rgba(64, 216, 176, 0.44);
  }

  .ctrl-play:active:not(:disabled) {
    background: var(--accent-deep);
    color: var(--text-hi);
  }

  /* Tactile Volume Slider Bar (48px touch zone + 32px circular thumb) */
  .volume-bar {
    width: 276px;
    height: 48px;
    padding: 0 10px;
    border-radius: var(--radius-pill);
    background: rgba(22, 32, 46, 0.86);
    border: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  .vol-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    color: var(--text-mid);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .vol-icon.hi {
    color: var(--text-hi);
  }

  .vol-slider {
    position: relative;
    flex: 1;
    height: 48px;
    display: flex;
    align-items: center;
    cursor: pointer;
    touch-action: none;
  }

  .vol-rail {
    width: 100%;
    height: 7px;
    border-radius: var(--radius-pill);
    background: var(--bg-3);
    border: 1px solid rgba(92, 119, 148, 0.35);
    overflow: hidden;
  }

  .vol-fill {
    height: 100%;
    width: 70%;
    border-radius: var(--radius-pill);
    background: linear-gradient(90deg, #1FB591 0%, var(--accent) 100%);
  }

  .vol-thumb {
    position: absolute;
    top: 50%;
    left: 70%;
    width: 32px;
    height: 32px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, #E7F0F7 75%, #C8D8E6 100%);
    border: 2px solid var(--accent);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6), 0 0 8px rgba(64, 216, 176, 0.28);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 100ms ease;
  }

  .vol-thumb::after {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent-deep);
  }

  .vol-slider:active .vol-thumb {
    transform: translate(-50%, -50%) scale(1.07);
  }
</style>
</head>
<body>
  <main class="watch-screen" aria-label="Media Player">
    <div class="ambient-bezel" aria-hidden="true"></div>

    <section class="safe-area">
      <!-- Circular Album Cover Disc + Orbiting Playback Progress Ring -->
      <div class="cover-stage">
        <svg class="cover-ring-svg" viewBox="0 0 132 132" aria-hidden="true">
          <defs>
            <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="2.5" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <!-- Track (r = 61) -->
          <circle cx="66" cy="66" r="61" fill="none" stroke="#1F2C3D" stroke-width="5" />
          <!-- Progress arc (~62% played) -->
          <circle
            id="playArc"
            cx="66"
            cy="66"
            r="61"
            fill="none"
            stroke="#40D8B0"
            stroke-width="5"
            stroke-linecap="round"
            stroke-dasharray="383.27"
            stroke-dashoffset="145.64"
            transform="rotate(-90 66 66)"
            filter="url(#ringGlow)"
          />
          <circle id="playDot" cx="24.2" cy="110.5" r="4" fill="#F2F7FB" filter="url(#ringGlow)" />
        </svg>

        <!-- Hand-crafted abstract aurora vinyl cover art -->
        <div class="cover-disc" aria-hidden="true">
          <svg viewBox="0 0 108 108">
            <defs>
              <linearGradient id="artBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#173847" />
                <stop offset="50%" stop-color="#0F2032" />
                <stop offset="100%" stop-color="#1B1932" />
              </linearGradient>
              <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#40D8B0" stop-opacity="0.85" />
                <stop offset="100%" stop-color="#5B9DF7" stop-opacity="0.7" />
              </linearGradient>
              <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#FF6B79" stop-opacity="0.75" />
                <stop offset="100%" stop-color="#FFD78E" stop-opacity="0.55" />
              </linearGradient>
            </defs>
            <rect width="108" height="108" fill="url(#artBg)" />
            <circle cx="76" cy="28" r="18" fill="#FFD78E" fill-opacity="0.22" />
            <circle cx="76" cy="28" r="10" fill="#FFD78E" fill-opacity="0.45" />
            <path d="M-4 66 C 22 44, 48 82, 74 56 C 90 40, 102 52, 114 48 L114 112 L-4 112 Z" fill="url(#wave1)" />
            <path d="M-4 82 C 24 68, 52 94, 82 74 C 96 65, 104 72, 114 70 L114 112 L-4 112 Z" fill="url(#wave2)" />
            <!-- Subtle vinyl grooves + glossy diagonal sheen + center spindle -->
            <circle cx="54" cy="54" r="44" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
            <circle cx="54" cy="54" r="34" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
            <path d="M0 0 L108 0 L0 108 Z" fill="rgba(255,255,255,0.06)" />
            <circle cx="54" cy="54" r="10" fill="#0D1420" stroke="rgba(242,247,251,0.3)" stroke-width="1.5" />
            <circle cx="54" cy="54" r="3" fill="#40D8B0" />
          </svg>
        </div>
      </div>

      <!-- Track Title + Artist & Elapsed -->
      <div class="track-meta">
        <h1 id="trackTitle" class="track-title">Midnight Pulse</h1>
        <div class="track-sub">
          <span id="trackArtist">Lume Synth</span>
          <span class="sub-sep" aria-hidden="true"></span>
          <span id="trackTime">02:14 / 03:42</span>
        </div>
      </div>

      <!-- Prev / Play-Pause / Next -->
      <div class="transport" role="group" aria-label="Playback controls">
        <button id="btnPrev" class="ctrl-btn ctrl-skip" type="button" aria-label="Previous track">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <rect x="3.5" y="4.2" width="2.4" height="11.6" rx="1.2" />
            <path d="M16.2 4.6C16.2 4.0 15.5 3.65 15.0 4.0L7.2 9.4C6.8 9.68 6.8 10.32 7.2 10.6L15.0 16.0C15.5 16.35 16.2 16.0 16.2 15.4V4.6Z" />
          </svg>
        </button>

        <button id="btnPlay" class="ctrl-btn ctrl-play" type="button" aria-label="Pause">
          <svg id="iconPause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4.5" width="4.4" height="15" rx="1.8" />
            <rect x="13.6" y="4.5" width="4.4" height="15" rx="1.8" />
          </svg>
          <svg id="iconPlay" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none; margin-left: 2px;">
            <path d="M6.5 4.8C6.5 3.9 7.48 3.35 8.24 3.83L19.4 10.9C20.1 11.35 20.1 12.65 19.4 13.1L8.24 20.17C7.48 20.65 6.5 20.1 6.5 19.2V4.8Z" />
          </svg>
        </button>

        <button id="btnNext" class="ctrl-btn ctrl-skip" type="button" aria-label="Next track">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path d="M3.8 4.6C3.8 4.0 4.5 3.65 5.0 4.0L12.8 9.4C13.2 9.68 13.2 10.32 12.8 10.6L5.0 16.0C4.5 16.35 3.8 16.0 3.8 15.4V4.6Z" />
            <rect x="14.1" y="4.2" width="2.4" height="11.6" rx="1.2" />
          </svg>
        </button>
      </div>

      <!-- Tactile Volume Bar -->
      <div class="volume-bar">
        <span class="vol-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M3 7H6L10 3.8V14.2L6 11H3V7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          </svg>
        </span>

        <div id="volSlider" class="vol-slider" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" tabindex="0">
          <div class="vol-rail">
            <div id="volFill" class="vol-fill"></div>
          </div>
          <div id="volThumb" class="vol-thumb"></div>
        </div>

        <span class="vol-icon hi" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M2.5 7H5.5L9.2 3.8V14.2L5.5 11H2.5V7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M11.8 6.4C12.9 7.4 12.9 10.6 11.8 11.6M14 4.6C16 6.6 16 11.4 14 13.4" stroke="#40D8B0" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </span>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const tracks = [
        { title: 'Midnight Pulse', artist: 'Lume Synth', time: '02:14 / 03:42', frac: 0.62 },
        { title: 'Aurora Drift', artist: 'Nordic Wave', time: '01:08 / 04:15', frac: 0.27 },
        { title: 'Solar Echo', artist: 'AMOLED Club', time: '02:51 / 03:30', frac: 0.81 }
      ];
      let idx = 0, playing = true, vol = 70;
      const CIRC = 2 * Math.PI * 61;

      const titleEl = document.getElementById('trackTitle');
      const artistEl = document.getElementById('trackArtist');
      const timeEl = document.getElementById('trackTime');
      const arc = document.getElementById('playArc');
      const dot = document.getElementById('playDot');
      const iconPause = document.getElementById('iconPause');
      const iconPlay = document.getElementById('iconPlay');
      const volSlider = document.getElementById('volSlider');
      const volFill = document.getElementById('volFill');
      const volThumb = document.getElementById('volThumb');

      function render() {
        const t = tracks[idx];
        titleEl.textContent = t.title;
        artistEl.textContent = t.artist;
        timeEl.textContent = t.time;

        arc.style.strokeDasharray = CIRC.toFixed(2);
        arc.style.strokeDashoffset = (CIRC * (1 - t.frac)).toFixed(2);
        const rad = (-90 + t.frac * 360) * Math.PI / 180;
        dot.setAttribute('cx', (66 + Math.cos(rad) * 61).toFixed(1));
        dot.setAttribute('cy', (66 + Math.sin(rad) * 61).toFixed(1));

        iconPause.style.display = playing ? 'block' : 'none';
        iconPlay.style.display = playing ? 'none' : 'block';

        const vp = 8 + (vol / 100) * 84;
        volFill.style.width = vp + '%';
        volThumb.style.left = vp + '%';
        volSlider.setAttribute('aria-valuenow', String(vol));
      }

      document.getElementById('btnPlay').onclick = () => { playing = !playing; render(); };
      document.getElementById('btnPrev').onclick = () => { idx = (idx + tracks.length - 1) % tracks.length; render(); };
      document.getElementById('btnNext').onclick = () => { idx = (idx + 1) % tracks.length; render(); };

      function setVol(clientX) {
        const r = volSlider.getBoundingClientRect();
        vol = Math.round(Math.max(0, Math.min(1, (clientX - r.left) / r.width)) * 100);
        render();
      }
      volSlider.addEventListener('pointerdown', (e) => { volSlider.setPointerCapture(e.pointerId); setVol(e.clientX); });
      volSlider.addEventListener('pointermove', (e) => { if (e.buttons) setVol(e.clientX); });

      render();
    })();
  </script>
</body>
</html>
