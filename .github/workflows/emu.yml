name: Emulated board screenshots

on:
  push:
    paths:
      - 'firmware/**'
      - 'examples/**'
      - 'tools/emu/**'
      - '.github/workflows/emu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install app bundler
        run: npm ci --prefix tools/lume
      - name: Build firmware with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware
      - name: Build pinned esp32sim with Lume board patch
        run: tools/emu/setup.sh
      - name: Fetch S3 mask ROM
        run: tools/emu/fetch-rom.sh
      - name: Capture screenshots and serial logs
        env:
          EMU_SKIP_BUILD: '1'
          EMU_BIN: tools/emu/.cache/bin/esp32sim
          EMU_ROM: tools/emu/.cache/rom/esp32s3_rev0_rom.elf
        run: |
          tools/emu/run.sh examples/counter
          tools/emu/run.sh examples/files
          # image_gallery excluded: Image-decode path diverges on CI esp32sim
          # (eval hang, 9x insn divergence); see KNOWN-SIMPLIFICATIONS r51b.
          tools/emu/run.sh examples/games_2048
          EMU_BOARD=lume-amoled216-no-imu EMU_OUTPUT_DIR=artifacts/emu/gravity_ball_no_imu tools/emu/run.sh examples/gravity_ball
      - name: Scan regression (speedometer + dashboard, N=5)
        # Reuses the esp32sim + S3 ROM built by setup.sh / fetch-rom.sh above
        # and the firmware images from espressif/esp-idf-ci-action. scan.js
        # reads EMU_BIN / EMU_ROM (scan.js:simBin()/findRom()) and requires
        # firmware/build/*.bin (scan.js:images()); EMU_SKIP_BUILD is a run.sh
        # knob, not consumed by scan.js. Output is --json (parseable); a FAIL
        # exits 1 and, with set -e, turns the job red (no || true).
        env:
          EMU_BIN: tools/emu/.cache/bin/esp32sim
          EMU_ROM: tools/emu/.cache/rom/esp32s3_rev0_rom.elf
        run: |
          set -euo pipefail
          node tools/lume/lume.js screenshot --scan 5 examples/speedometer --json
          node tools/lume/lume.js screenshot --scan 5 examples/dashboard --json
      - name: Upload screenshots, logs and scan products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lume-emu-${{ github.run_number }}
          path: |
            artifacts/emu/
            artifacts/check/
          if-no-files-found: warn
