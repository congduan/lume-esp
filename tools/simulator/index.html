<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lume Host Simulator</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 14px; background: #151922; color: #d8e1ef; font: 14px system-ui, sans-serif; }
  header { display: flex; justify-content: space-between; }
  #device { position: relative; width: 480px; height: 480px; overflow: hidden; background: #000; box-shadow: 0 0 0 8px #323b49, 0 20px 55px #0009; border-radius: 24px; }
  .lume-node { position: relative; min-width: 0; min-height: 0; flex-shrink: 0; }
  .kind-0 { background: transparent; }
  .kind-1 { color: white; white-space: pre-wrap; }
  .kind-2 { display: flex; align-items: center; justify-content: center; background: #385ca5; color: white; border-radius: 6px; user-select: none; }
  .pressable { cursor: pointer; }
  .image-placeholder { background: #777; color: white; display: grid; place-items: center; }
  #error { color: #ff968e; max-width: 480px; white-space: pre-wrap; overflow: auto; }
</style>
<header><strong>Lume Host Simulator</strong><span>480 × 480</span></header>
<div id="device" aria-label="Lume device preview"></div>
<pre id="error"></pre>
<script src="/renderer.js"></script><script src="/page.js"></script>
</html>
